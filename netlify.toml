[build]
  publish = "dist"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[redirects]]
  from = "/links-uteis.html"
  to = "/certificacoes.html"
  status = 301

[[redirects]]
  from = "/en/links-uteis.html"
  to = "/en/certificacoes.html"
  status = 301

[[redirects]]
  from = "/links-uteis"
  to = "/certificacoes.html"
  status = 301

[[redirects]]
  from = "/en/links-uteis"
  to = "/en/certificacoes.html"
  status = 301
